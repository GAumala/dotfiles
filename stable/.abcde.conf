# Output format
OUTPUTTYPE=flac

# CD device (adjust if needed)
CDROM=/dev/sr0

# CDDB settings
CDDBURL="http://gnudb.gnudb.org/~cddb/cddb.cgi"
CDDBPROTO=6

# Output directory structure
OUTPUTDIR="$HOME/Music/"
OUTPUTFORMAT='${ARTISTFILE} - ${ALBUMFILE}/${TRACKNUM}.${TRACKFILE}'

# Encoding options
FLACENCODERSYNTAX=flac
FLACOPTS='-s -e -V -8'

# Paranoid ripping (multiple reads for accuracy)
MAXRIP=3
INTERACTIVE=n
